
name: Build Musaji'Den APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Locate Android project
        run: |
          PROJECT_FILE=$(find . -type f -path '*/app/build.gradle' \
            -not -path '*/build/*' | head -n 1)

          if [ -z "$PROJECT_FILE" ]; then
            echo "ERROR: app/build.gradle tidak ditemukan"
            find . -maxdepth 5 -type f | head -n 100
            exit 1
          fi

          PROJECT_DIR=$(dirname "$(dirname "$PROJECT_FILE")")
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV

          echo "Project ditemukan: $PROJECT_DIR"

          test -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml"
          test -f "$PROJECT_DIR/app/src/main/assets/index.html"

      - name: Restore private release signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"

          echo "$ANDROID_KEYSTORE_BASE64" \
            | base64 --decode > "$PROJECT_DIR/app/release-key.jks"

          test -s "$PROJECT_DIR/app/release-key.jks"
          echo "Release keystore OK"

      - name: Build signed release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"

          cd "$PROJECT_DIR"
          gradle --no-daemon assembleRelease

      - name: Verify APK signature
        run: |
          APK="$PROJECT_DIR/app/build/outputs/apk/release/app-release.apk"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"

          test -f "$APK"
          test -x "$APKSIGNER"

          "$APKSIGNER" verify --verbose --print-certs "$APK"

          echo "APK RELEASE BERHASIL DIVERIFIKASI"

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: MusajiDen-v13-Release-APK
          path: '**/app/build/outputs/apk/release/app-release.apk'
          if-no-files-found: error
          retention-days: 30
