
name: Build Musaji'Den APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract Musaji'Den v14
        run: |
          ZIP_FILE="MusajiDen-Android-Source-v14-Keuangan-Bottom-Nav.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: ZIP source v14 tidak ditemukan"
            ls -lah
            exit 1
          fi

          mkdir -p extracted
          unzip -q "$ZIP_FILE" -d extracted

          PROJECT_DIR="extracted/JumatBerkahAndroid"

          if [ ! -f "$PROJECT_DIR/app/build.gradle" ]; then
            echo "ERROR: app/build.gradle tidak ditemukan"
            find extracted -maxdepth 6 -type f | head -n 100
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml" ]; then
            echo "ERROR: AndroidManifest.xml tidak ditemukan"
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/app/src/main/assets/index.html" ]; then
            echo "ERROR: index.html tidak ditemukan"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV
          echo "Source v14 berhasil diekstrak"

      - name: Restore private release signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "ERROR: ANDROID_KEYSTORE_BASE64 belum tersedia"
            exit 1
          fi

          echo "$ANDROID_KEYSTORE_BASE64" \
            | base64 --decode > "$PROJECT_DIR/app/release-key.jks"

          if [ ! -s "$PROJECT_DIR/app/release-key.jks" ]; then
            echo "ERROR: Release keystore gagal disiapkan"
            exit 1
          fi

          echo "Release keystore berhasil disiapkan"

      - name: Build signed release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"

          cd "$PROJECT_DIR"
          gradle --no-daemon assembleRelease

      - name: Verify APK signature
        run: |
          APK="$PROJECT_DIR/app/build/outputs/apk/release/app-release.apk"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK Release tidak ditemukan"
            exit 1
          fi

          "$APKSIGNER" verify --verbose --print-certs "$APK"

          echo "APK RELEASE BERHASIL DIVERIFIKASI"

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: MusajiDen-v14-Keuangan-Bottom-Nav
          path: extracted/JumatBerkahAndroid/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
