
name: Build Musaji'Den APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'MusajiDen-Android-Source-v11-Nama-Aplikasi.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Extract Android source ZIP
        run: |
          SOURCE_ZIP="MusajiDen-Android-Source-v11-Nama-Aplikasi.zip"

          if [ ! -f "$SOURCE_ZIP" ]; then
            echo "ERROR: Source ZIP tidak ditemukan!"
            ls -lah
            exit 1
          fi

          unzip -q "$SOURCE_ZIP" -d extracted

          PROJECT_DIR="extracted/JumatBerkahAndroid"

          if [ ! -f "$PROJECT_DIR/settings.gradle" ]; then
            echo "ERROR: settings.gradle tidak ditemukan!"
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/app/build.gradle" ]; then
            echo "ERROR: app/build.gradle tidak ditemukan!"
            exit 1
          fi

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Restore private release signing key
        working-directory: extracted/JumatBerkahAndroid
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "ERROR: Secret ANDROID_KEYSTORE_BASE64 belum diisi!"
            exit 1
          fi

          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > app/release-key.jks

          if [ ! -s app/release-key.jks ]; then
            echo "ERROR: Keystore gagal dipulihkan!"
            exit 1
          fi

          echo "Keystore berhasil dipulihkan."

      - name: Build signed Release APK
        working-directory: extracted/JumatBerkahAndroid
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          gradle --no-daemon assembleRelease

      - name: Verify signed APK
        working-directory: extracted/JumatBerkahAndroid
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK Release tidak ditemukan!"
            exit 1
          fi

          if [ ! -f "$APKSIGNER" ]; then
            echo "ERROR: apksigner tidak ditemukan!"
            exit 1
          fi

          "$APKSIGNER" verify --verbose "$APK"

          echo "APK berhasil diverifikasi."
          ls -lh "$APK"

      - name: Upload signed Release APK
        uses: actions/upload-artifact@v4
        with:
          name: MusajiDen-v11-Release-Signed
          path: extracted/JumatBerkahAndroid/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
