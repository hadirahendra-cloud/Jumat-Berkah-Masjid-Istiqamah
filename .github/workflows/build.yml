
name: Build Musaji'Den v17 - Beranda Utama Donasi

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'MusajiDen-Android-Source-v17-Beranda-Utama-Donasi.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Temurin Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        shell: bash
        run: |
          set -euo pipefail

          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          set +o pipefail
          yes | sdkmanager --licenses || true
          set -o pipefail

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract Musaji'Den v17 source
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="MusajiDen-Android-Source-v17-Beranda-Utama-Donasi.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "::error::ZIP source v17 tidak ditemukan."
            find . -maxdepth 2 -type f -name '*.zip'
            exit 1
          fi

          unzip -t "$ZIP_FILE" >/dev/null

          mkdir -p extracted
          unzip -q "$ZIP_FILE" -d extracted

          PROJECT_DIR="extracted/JumatBerkahAndroid"

          if [ ! -f "$PROJECT_DIR/app/build.gradle" ]; then
            echo "::error::app/build.gradle tidak ditemukan."
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml" ]; then
            echo "::error::AndroidManifest.xml tidak ditemukan."
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/app/src/main/assets/index.html" ]; then
            echo "::error::index.html tidak ditemukan."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Source v17 berhasil diekstrak."

      - name: Verify application identity and version
        shell: bash
        run: |
          set -euo pipefail

          GRADLE_FILE="$PROJECT_DIR/app/build.gradle"

          grep -Fq "applicationId 'com.masjidistiqamah.jumatberkah'" "$GRADLE_FILE"
          grep -Fq "versionCode 4" "$GRADLE_FILE"
          grep -Fq "versionName '1.3'" "$GRADLE_FILE"
          grep -Fq "compileSdk 35" "$GRADLE_FILE"

          echo "Package, versi, dan SDK sesuai."

      - name: Restore existing release signing key
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail

          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 belum tersedia."
            exit 1
          fi

          echo "$ANDROID_KEYSTORE_BASE64" \
            | base64 --decode \
            > "$PROJECT_DIR/app/release-key.jks"

          if [ ! -s "$PROJECT_DIR/app/release-key.jks" ]; then
            echo "::error::Keystore gagal disiapkan."
            exit 1
          fi

          echo "Signing key lama berhasil disiapkan."

      - name: Build signed release APK
        shell: bash
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"

          cd "$PROJECT_DIR"

          gradle --no-daemon assembleRelease

      - name: Verify APK package and signature
        shell: bash
        run: |
          set -euo pipefail

          APK="$PROJECT_DIR/app/build/outputs/apk/release/app-release.apk"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"

          if [ ! -f "$APK" ]; then
            echo "::error::APK release tidak ditemukan."
            exit 1
          fi

          "$AAPT" dump badging "$APK" \
            | grep -F "package: name='com.masjidistiqamah.jumatberkah'"

          "$APKSIGNER" verify --verbose --print-certs "$APK"

          echo "APK v17 berhasil diverifikasi."

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: MusajiDen-v17-Beranda-Utama-Donasi
          path: extracted/JumatBerkahAndroid/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
