
name: Build Jumat Berkah APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'Jumat-Berkah-Android-Source-v4-Stempel-DKM.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Extract Android source ZIP
        run: |
          SOURCE_ZIP="Jumat-Berkah-Android-Source-v4-Stempel-DKM.zip"

          if [ ! -f "$SOURCE_ZIP" ]; then
            echo "ERROR: Source ZIP tidak ditemukan: $SOURCE_ZIP"
            ls -lah *.zip || true
            exit 1
          fi

          unzip -q "$SOURCE_ZIP" -d extracted

          if [ ! -f "extracted/JumatBerkahAndroid/settings.gradle" ]; then
            echo "ERROR: settings.gradle tidak ditemukan."
            find extracted -maxdepth 4 -type f
            exit 1
          fi

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        working-directory: extracted/JumatBerkahAndroid
        run: gradle --no-daemon assembleDebug

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Jumat-Berkah-v4-Stempel-DKM-APK
          path: extracted/JumatBerkahAndroid/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
